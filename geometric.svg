<svg width="340" height="340" viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="neonA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#006a75"/>
    </linearGradient>

    <linearGradient id="neonB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a1f"/>
      <stop offset="100%" stop-color="#021014"/>
    </linearGradient>
  </defs>

  <circle cx="170" cy="170" r="140"
    stroke="url(#neonA)" stroke-width="1.2"
    fill="none" stroke-dasharray="3 9">
    <animateTransform attributeName="transform" type="rotate"
      from="0 170 170" to="360 170 170"
      dur="12s" repeatCount="indefinite"/>
  </circle>

  <polygon points="170,40 300,260 40,260"
    stroke="url(#neonA)" stroke-width="1.5"
    fill="none">
    <animateTransform attributeName="transform" type="rotate"
      from="360 170 170" to="0 170 170"
      dur="10s" repeatCount="indefinite"/>
  </polygon>

  <polygon points="170,80 230,110 230,170 170,200 110,170 110,110"
    stroke="#00cbd6" stroke-width="1"
    fill="none" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate"
      from="0 170 170" to="360 170 170"
      dur="6s" repeatCount="indefinite"/>
  </polygon>

  <circle cx="170" cy="170" r="105"
    stroke="url(#neonB)" stroke-width="2"
    fill="none" stroke-dasharray="18 6">
    <animateTransform attributeName="transform" type="rotate"
      from="0 170 170" to="-360 170 170"
      dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="170" cy="170" r="80"
    stroke="#009eaa" stroke-width="1"
    fill="none" stroke-dasharray="2 8">
    <animateTransform attributeName="transform" type="rotate"
      from="360 170 170" to="0 170 170"
      dur="5s" repeatCount="indefinite"/>
  </circle>

  <path d="M170 30 A140 140 0 0 1 310 170"
    stroke="#00f0ff" stroke-width="2"
    fill="none">
    <animateTransform attributeName="transform" type="rotate"
      from="0 170 170" to="-360 170 170"
      dur="4s" repeatCount="indefinite"/>
  </path>

  <path d="M170 310 A140 140 0 0 1 30 170"
    stroke="#00f0ff" stroke-width="2"
    fill="none">
    <animateTransform attributeName="transform" type="rotate"
      from="0 170 170" to="360 170 170"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <g stroke="#007f8a" stroke-width="1">
    <line x1="170" y1="20" x2="170" y2="60"/>
    <line x1="320" y1="170" x2="280" y2="170"/>
    <line x1="170" y1="320" x2="170" y2="280"/>
    <line x1="20" y1="170" x2="60" y2="170"/>
    <animateTransform attributeName="transform" type="rotate"
      from="0 170 170" to="360 170 170"
      dur="14s" repeatCount="indefinite"/>
  </g>

  <circle cx="170" cy="170" r="20"
    stroke="#00f0ff" stroke-width="1.5"
    fill="none">
    <animate attributeName="r"
      values="20;35;20"
      dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="1;0.15;1"
      dur="2s" repeatCount="indefinite"/>
  </circle>

  <polygon points="170,145 185,170 170,195 155,170"
    fill="#00f0ff">
    <animateTransform attributeName="transform" type="rotate"
      from="0 170 170" to="360 170 170"
      dur="3s" repeatCount="indefinite"/>
  </polygon>

  <g fill="#00e6ff">
    <circle cx="170" cy="50" r="2">
      <animate attributeName="cy"
        values="50;290;50"
        dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="170" r="2">
      <animate attributeName="cx"
        values="290;50;290"
        dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>